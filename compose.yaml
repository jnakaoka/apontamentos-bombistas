services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bombistas
      POSTGRES_USER: bombistas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bombistas -d bombistas"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://bombistas:${DB_PASSWORD}@db:5432/bombistas
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Defina ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8085}:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  db_data:
